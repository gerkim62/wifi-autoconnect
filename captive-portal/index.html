    <script type="text/javascript">
        var isSubmitted = false;
        function submitAction() {
            var link = document.location.href;
            var searchString = "redirect=";
            var equalIndex = link.indexOf(searchString);
            var redirectUrl = "";
            var urlStr = "";
            var IsUserName = document.forms[0].username;
            var IsPassword = document.forms[0].password;
            if (IsUserName || IsPassword) {
                var uname = IsUserName.value;
                var passwd = IsPassword.value;
                if (uname == null || uname == "") {
                    alert("Username field cannot be empty");
                    return false;
                }
                if (passwd == null || passwd == "") {
                    alert("Password field cannot be empty");
                    return false;
                }
            }
            var isEmail = document.forms[0].email;
            if (isEmail) {
                var x = isEmail.value;
                var atpos = x.indexOf("@");
                var dotpos = x.lastIndexOf(".");
                if (atpos < 1 || dotpos < atpos + 2 || dotpos + 2 >= x.length) {
                    alert(" Please enter the valid e-mail address");
                    return false;
                }
            }
            if (equalIndex > 0) {
                equalIndex += searchString.length;
                urlStr = link.substring(equalIndex)
                if (urlStr.length > 0) {
                    redirectUrl += urlStr;
                    if (redirectUrl.length > 255)
                        redirectUrl = redirectUrl.substring(0, 255);
                    document.forms[0].redirect_url.value = redirectUrl;
                }
            }
            if (isSubmitted == false) {
                document.forms[0].submit();
                isSubmitted = true;
                return true;
            } else {
                alert("This page can not be submitted twice.");
                return false;
            }
        }

        function loadAction() {
            var url = window.location.href;
            var args = new Object();
            var query = location.search.substring(1);
            var pairs = query.split("&");
            for (var i = 0; i < pairs.length; i++) {
                var pos = pairs[i].indexOf('=');
                if (pos == -1) continue;
                var argname = pairs[i].substring(0, pos);
                var value = pairs[i].substring(pos + 1);
                args[argname] = unescape(value);
            }
            if (args.switch_url) {
                document.forms[0].action = args.switch_url;
            } else if (!document.forms[0].action) {
                document.forms[0].action = location.href;
            }
        }

    </script>
